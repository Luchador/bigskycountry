; Shared by the game and editor. Restart the application after changing this file.
[Graphics]
; 0 = off, 2 = 2x MSAA, 4 = 4x MSAA. Cutout materials use alpha-to-coverage with MSAA.
MSAA=4
; Screen-space ambient occlusion: 0 = off, 1 = on.
SSAO=1
; Samples per pixel (1..64). Higher counts reduce noise at a higher GPU cost.
SSAOSamples=16

[Streaming]
; Memory budgets in MiB. 0 keeps the corresponding Project Settings value.
; Explicit overrides accept whole numbers from 64 to 16384. Restart to apply.
; Geometry: separate limits for decoded CPU geometry and GPU buffers/staging (default 512 MiB each).
GeometryMiB=0
; Shared assets: half for model meshes, half for textures (default 512 MiB total).
AssetsMiB=0
; Streamed collision meshes/BVHs (default 256 MiB). Required nearby collision stays protected.
CollisionMiB=0
